<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Developer04 — Programmer</title>
<style>
  :root{--pink:#ff6ec4;--violet:#7873f5;--green:#4ade80}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Ubuntu,sans-serif;color:#e0e7ff;background:radial-gradient(circle at 20% 0%,#302b63,#0f0c29 60%);min-height:100vh}
  main{max-width:960px;margin:auto;padding:32px 20px}
  img{width:100%;display:block}
  .grid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center;margin:32px 0}
  .card{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:20px;padding:24px;backdrop-filter:blur(6px)}
  h2{background:linear-gradient(90deg,var(--pink),var(--violet),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
  li{margin:6px 0}
  @media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <img src="assets/header.svg" alt="Hi, I'm Developer04"/>
  <img src="assets/typing.svg" alt="" style="max-width:600px;margin:16px auto"/>
  <section class="grid">
    <div class="card">
      <h2>👨‍💻 About Me</h2>
      <ul>
        <li>🔭 Building full‑stack web apps</li>
        <li>🌱 Learning cloud, AI & system design</li>
        <li>👯 Open to open‑source collaboration</li>
        <li>💬 JavaScript · React · Node.js · Python</li>
      </ul>
    </div>
    <img src="assets/coder.svg" alt="coding robot"/>
  </section>
  <img src="assets/divider.svg" alt=""/>
  <h2>⚡ Skills</h2>
  <img src="assets/skills.svg" alt="skills"/>
  <h2>📊 Stats</h2>
  <img src="assets/stats.svg" alt="stats"/>
  <img src="assets/footer.svg" alt="footer" style="margin-top:32px"/>
</main>
</body>
</html>
