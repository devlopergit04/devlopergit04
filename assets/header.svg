<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/><stop offset=".5" stop-color="#302b63"/><stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0" stop-color="#ff6ec4"/><stop offset=".5" stop-color="#7873f5"/><stop offset="1" stop-color="#4ade80"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" x2="1"><stop offset="0" stop-color="#ff6ec4"/><stop offset="1" stop-color="#7873f5"/></linearGradient>
  </defs>
  <style>
    .t{font:800 54px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:url(#txt)}
    .s{font:500 20px 'Segoe UI',Ubuntu,sans-serif;fill:#c7d2fe;opacity:0;animation:fade 1.2s .6s forwards}
    .star{fill:#fff;animation:tw 3s ease-in-out infinite}
    .hand{transform-origin:70% 80%;transform-box:fill-box;animation:wave 2s ease-in-out infinite}
    @keyframes fade{to{opacity:1}}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    @keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-8deg)}}
  </style>
  <rect width="900" height="260" rx="22" fill="url(#bg)"/>
  <g>
    <circle class="star" cx="60" cy="40" r="2"/><circle class="star" cx="180" cy="200" r="1.5" style="animation-delay:.5s"/>
    <circle class="star" cx="320" cy="30" r="2" style="animation-delay:1s"/><circle class="star" cx="520" cy="215" r="1.6" style="animation-delay:1.5s"/>
    <circle class="star" cx="700" cy="45" r="2.2" style="animation-delay:.8s"/><circle class="star" cx="840" cy="190" r="1.5" style="animation-delay:2s"/>
    <circle class="star" cx="780" cy="110" r="1.2" style="animation-delay:1.2s"/><circle class="star" cx="110" cy="130" r="1.3" style="animation-delay:2.4s"/>
  </g>
  <text class="t" x="450" y="120" text-anchor="middle">Hi, I'm Developer04 <tspan class="hand">👋</tspan></text>
  <text class="s" x="450" y="160" text-anchor="middle">Full‑Stack Developer · Open‑Source Lover · Coffee‑Driven Coder ☕</text>
  <path fill="url(#wave)" opacity=".35">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0 220 Q225 190 450 220 T900 220 V260 H0Z;M0 220 Q225 250 450 220 T900 220 V260 H0Z;M0 220 Q225 190 450 220 T900 220 V260 H0Z"/>
  </path>
  <path fill="url(#wave)" opacity=".6">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0 235 Q225 255 450 235 T900 235 V260 H0Z;M0 235 Q225 215 450 235 T900 235 V260 H0Z;M0 235 Q225 255 450 235 T900 235 V260 H0Z"/>
  </path>
</svg>
