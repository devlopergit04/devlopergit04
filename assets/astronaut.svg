<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320">
<defs>
<radialGradient id="sp" cx=".5" cy=".5" r=".7"><stop offset="0" stop-color="#302b63"/><stop offset="1" stop-color="#0f0c29"/></radialGradient>
<linearGradient id="pl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6ec4"/><stop offset="1" stop-color="#7873f5"/></linearGradient>
<linearGradient id="vis" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
</defs>
<style>
.fl{animation:fl 6s ease-in-out infinite;transform-origin:210px 160px}
.st{fill:#fff;animation:tw 3s ease-in-out infinite}
.orb{animation:spin 10s linear infinite;transform-origin:330px 80px}
.wave{transform-box:fill-box;transform-origin:top center;animation:wv 1.6s ease-in-out infinite}
.bub{font:700 14px Consolas,monospace;fill:#4ade80;animation:bb 6s infinite}
@keyframes fl{0%,100%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(0,-16px) rotate(6deg)}}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wv{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(30deg)}}
@keyframes bb{0%,10%{opacity:0}20%,80%{opacity:1}90%,100%{opacity:0}}
</style>
<rect width="420" height="320" rx="20" fill="url(#sp)"/>
<circle class="st" cx="40" cy="40" r="2"/><circle class="st" cx="90" cy="270" r="1.5" style="animation-delay:1s"/><circle class="st" cx="380" cy="250" r="2" style="animation-delay:.5s"/><circle class="st" cx="150" cy="30" r="1.2" style="animation-delay:2s"/><circle class="st" cx="260" cy="290" r="1.6" style="animation-delay:1.5s"/><circle class="st" cx="30" cy="160" r="1.4" style="animation-delay:.8s"/>
<circle cx="330" cy="80" r="34" fill="url(#pl)"/><ellipse cx="330" cy="80" rx="56" ry="12" fill="none" stroke="#facc15" stroke-width="3" opacity=".8"/>
<g class="orb"><circle cx="330" cy="20" r="6" fill="#4ade80"/></g>
<circle cx="70" cy="90" r="14" fill="#facc15" opacity=".8"><animate attributeName="opacity" values=".5;1;.5" dur="3s" repeatCount="indefinite"/></circle>
<g class="fl">
 <path d="M150 170 q-40 30 -60 80" stroke="#c7d2fe" stroke-width="3" fill="none" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;24" dur="1s" repeatCount="indefinite"/></path>
 <rect x="170" y="150" width="80" height="80" rx="24" fill="#e0e7ff"/>
 <rect x="188" y="170" width="44" height="26" rx="6" fill="#302b63"/>
 <circle cx="198" cy="183" r="4" fill="#ff6ec4"><animate attributeName="fill" values="#ff6ec4;#4ade80;#ff6ec4" dur="1.2s" repeatCount="indefinite"/></circle>
 <rect x="206" y="180" width="20" height="5" rx="2" fill="#38bdf8"/>
 <rect class="wave" x="246" y="155" width="18" height="50" rx="9" fill="#e0e7ff"/>
 <rect x="156" y="160" width="18" height="50" rx="9" fill="#e0e7ff"/>
 <rect x="180" y="225" width="22" height="34" rx="10" fill="#e0e7ff"/><rect x="218" y="225" width="22" height="34" rx="10" fill="#e0e7ff"/>
 <circle cx="210" cy="115" r="46" fill="#e0e7ff"/>
 <ellipse cx="210" cy="117" rx="34" ry="28" fill="url(#vis)"/>
 <ellipse cx="198" cy="106" rx="10" ry="6" fill="#fff" opacity=".6"/>
 <text x="210" y="125" text-anchor="middle" font-family="Consolas,monospace" font-weight="700" font-size="16" fill="#4ade80">&lt;/&gt;</text>
</g>
<text class="bub" x="30" y="300">$ git push origin space 🚀</text>
</svg>
