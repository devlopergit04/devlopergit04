<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0c29"/><stop offset="1" stop-color="#302b63"/></linearGradient>
  </defs>
  <style>
    .h{font:800 26px 'Segoe UI',Ubuntu,sans-serif;fill:#fff}
    .n{font:600 17px 'Segoe UI',Ubuntu,sans-serif;fill:#e0e7ff}
    .p{font:600 14px Consolas,monospace;fill:#a5b4fc}
    .bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.6s cubic-bezier(.2,.8,.2,1) forwards}
    .row{opacity:0;animation:in .6s forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    @keyframes in{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
  </style>
  <rect width="800" height="400" rx="20" fill="url(#bg)"/>
  <text class="h" x="40" y="52">⚡ Skills &amp; Superpowers</text>
  <g font-family="sans-serif">
    <g class="row" style="animation-delay:.1s"><text class="n" x="40" y="105">🟨 JavaScript / TypeScript</text><rect x="300" y="92" width="400" height="14" rx="7" fill="#ffffff15"/><rect class="bar" style="animation-delay:.2s" x="300" y="92" width="380" height="14" rx="7" fill="#facc15"/><text class="p" x="715" y="105">95%</text></g>
    <g class="row" style="animation-delay:.3s"><text class="n" x="40" y="150">⚛️ React / Next.js</text><rect x="300" y="137" width="400" height="14" rx="7" fill="#ffffff15"/><rect class="bar" style="animation-delay:.4s" x="300" y="137" width="360" height="14" rx="7" fill="#38bdf8"/><text class="p" x="715" y="150">90%</text></g>
    <g class="row" style="animation-delay:.5s"><text class="n" x="40" y="195">🟩 Node.js / Express</text><rect x="300" y="182" width="400" height="14" rx="7" fill="#ffffff15"/><rect class="bar" style="animation-delay:.6s" x="300" y="182" width="340" height="14" rx="7" fill="#4ade80"/><text class="p" x="715" y="195">85%</text></g>
    <g class="row" style="animation-delay:.7s"><text class="n" x="40" y="240">🐍 Python</text><rect x="300" y="227" width="400" height="14" rx="7" fill="#ffffff15"/><rect class="bar" style="animation-delay:.8s" x="300" y="227" width="320" height="14" rx="7" fill="#7873f5"/><text class="p" x="715" y="240">80%</text></g>
    <g class="row" style="animation-delay:.9s"><text class="n" x="40" y="285">🎨 HTML / CSS / Tailwind</text><rect x="300" y="272" width="400" height="14" rx="7" fill="#ffffff15"/><rect class="bar" style="animation-delay:1s" x="300" y="272" width="370" height="14" rx="7" fill="#ff6ec4"/><text class="p" x="715" y="285">92%</text></g>
    <g class="row" style="animation-delay:1.1s"><text class="n" x="40" y="330">🐘 SQL / PostgreSQL</text><rect x="300" y="317" width="400" height="14" rx="7" fill="#ffffff15"/><rect class="bar" style="animation-delay:1.2s" x="300" y="317" width="300" height="14" rx="7" fill="#fb923c"/><text class="p" x="715" y="330">75%</text></g>
    <g class="row" style="animation-delay:1.3s"><text class="n" x="40" y="375">🐳 Git / Docker / CI</text><rect x="300" y="362" width="400" height="14" rx="7" fill="#ffffff15"/><rect class="bar" style="animation-delay:1.4s" x="300" y="362" width="310" height="14" rx="7" fill="#22d3ee"/><text class="p" x="715" y="375">78%</text></g>
  </g>
</svg>
