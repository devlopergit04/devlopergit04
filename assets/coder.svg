<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320">
  <style>
    .float{animation:fl 4s ease-in-out infinite}
    .sym{font:700 22px Consolas,monospace;animation:up 5s linear infinite;opacity:0}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
    .screen{animation:glow 2s ease-in-out infinite alternate}
    .code{animation:scroll 3s linear infinite}
    .arm{transform-box:fill-box;transform-origin:top center;animation:tap .35s ease-in-out infinite alternate}
    .arm2{animation-delay:.17s}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes up{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-120px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    @keyframes glow{from{fill:#1e1b4b}to{fill:#312e81}}
    @keyframes scroll{from{transform:translateY(0)}to{transform:translateY(-24px)}}
    @keyframes tap{from{transform:rotate(-4deg)}to{transform:rotate(6deg)}}
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6ec4"/><stop offset="1" stop-color="#7873f5"/></linearGradient>
    <clipPath id="sc"><rect x="150" y="186" width="120" height="64" rx="4"/></clipPath>
  </defs>
  <text class="sym" x="60" y="200" fill="#ff6ec4">&lt;/&gt;</text>
  <text class="sym" x="330" y="190" fill="#4ade80" style="animation-delay:1.3s">{ }</text>
  <text class="sym" x="90" y="120" fill="#facc15" style="animation-delay:2.6s">=&gt;</text>
  <text class="sym" x="320" y="110" fill="#38bdf8" style="animation-delay:3.7s">#</text>
  <ellipse cx="210" cy="300" rx="140" ry="10" fill="#7873f5" opacity=".25"/>
  <g class="float">
    <!-- robot head -->
    <line x1="210" y1="40" x2="210" y2="62" stroke="#7873f5" stroke-width="4"/>
    <circle cx="210" cy="36" r="7" fill="#ff6ec4"><animate attributeName="r" values="7;9;7" dur="1.5s" repeatCount="indefinite"/></circle>
    <rect x="160" y="62" width="100" height="78" rx="22" fill="url(#g)"/>
    <rect x="172" y="76" width="76" height="46" rx="14" fill="#0f0c29"/>
    <ellipse class="eye" cx="194" cy="98" rx="7" ry="9" fill="#4ade80"/>
    <ellipse class="eye" cx="226" cy="98" rx="7" ry="9" fill="#4ade80"/>
    <path d="M198 112 Q210 120 222 112" stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- body -->
    <rect x="170" y="146" width="80" height="40" rx="12" fill="#302b63"/>
    <rect class="arm" x="140" y="150" width="16" height="58" rx="8" fill="#ff6ec4"/>
    <rect class="arm arm2" x="264" y="150" width="16" height="58" rx="8" fill="#7873f5"/>
  </g>
  <!-- laptop -->
  <rect class="screen" x="142" y="178" width="136" height="80" rx="8" fill="#1e1b4b" stroke="#7873f5" stroke-width="3"/>
  <g clip-path="url(#sc)"><g class="code">
    <rect x="156" y="192" width="50" height="5" rx="2" fill="#ff6ec4"/><rect x="212" y="192" width="30" height="5" rx="2" fill="#4ade80"/>
    <rect x="166" y="204" width="70" height="5" rx="2" fill="#38bdf8"/>
    <rect x="166" y="216" width="40" height="5" rx="2" fill="#facc15"/><rect x="210" y="216" width="40" height="5" rx="2" fill="#ff6ec4"/>
    <rect x="156" y="228" width="60" height="5" rx="2" fill="#4ade80"/>
    <rect x="156" y="240" width="50" height="5" rx="2" fill="#ff6ec4"/><rect x="212" y="240" width="30" height="5" rx="2" fill="#4ade80"/>
    <rect x="166" y="252" width="70" height="5" rx="2" fill="#38bdf8"/>
    <rect x="166" y="264" width="40" height="5" rx="2" fill="#facc15"/>
  </g></g>
  <path d="M120 258 H300 L312 274 H108Z" fill="#4c4a8a"/>
</svg>
