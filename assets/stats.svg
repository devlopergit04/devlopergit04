<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#302b63"/><stop offset="1" stop-color="#0f0c29"/></linearGradient></defs>
  <style>
    .c{opacity:0;animation:pop .6s cubic-bezier(.3,1.6,.5,1) forwards;transform-box:fill-box;transform-origin:center}
    .big{font:800 28px 'Segoe UI',Ubuntu,sans-serif}.lbl{font:500 13px 'Segoe UI',Ubuntu,sans-serif;fill:#c7d2fe}
    .ring{fill:none;stroke-width:5;stroke-dasharray:220;stroke-dashoffset:220;animation:draw 1.8s .3s forwards}
    @keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
    @keyframes draw{to{stroke-dashoffset:0}}
  </style>
  <rect width="900" height="160" rx="20" fill="url(#bg)"/>
  <g class="c" style="animation-delay:.1s"><circle class="ring" cx="75" cy="70" r="35" stroke="#ff6ec4"/><text class="big" x="75" y="80" text-anchor="middle" fill="#ff6ec4">5+</text><text class="lbl" x="75" y="138" text-anchor="middle">Years Coding</text></g>
  <g class="c" style="animation-delay:.25s"><circle class="ring" cx="225" cy="70" r="35" stroke="#7873f5"/><text class="big" x="225" y="80" text-anchor="middle" fill="#7873f5">50+</text><text class="lbl" x="225" y="138" text-anchor="middle">Projects Built</text></g>
  <g class="c" style="animation-delay:.4s"><circle class="ring" cx="375" cy="70" r="35" stroke="#4ade80"/><text class="big" x="375" y="80" text-anchor="middle" fill="#4ade80">1K+</text><text class="lbl" x="375" y="138" text-anchor="middle">Commits / Year</text></g>
  <g class="c" style="animation-delay:.55s"><circle class="ring" cx="525" cy="70" r="35" stroke="#38bdf8"/><text class="big" x="525" y="80" text-anchor="middle" fill="#38bdf8">25+</text><text class="lbl" x="525" y="138" text-anchor="middle">Repositories</text></g>
  <g class="c" style="animation-delay:.7s"><circle class="ring" cx="675" cy="70" r="35" stroke="#a78bfa"/><text class="big" x="675" y="80" text-anchor="middle" fill="#a78bfa">10+</text><text class="lbl" x="675" y="138" text-anchor="middle">Bots Launched</text></g>
  <g class="c" style="animation-delay:.85s"><circle class="ring" cx="825" cy="70" r="35" stroke="#facc15"/><text class="big" x="825" y="80" text-anchor="middle" fill="#facc15">∞</text><text class="lbl" x="825" y="138" text-anchor="middle">Cups of Coffee</text></g>
</svg>
