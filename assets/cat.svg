<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0f0c29"/></linearGradient></defs>
<style>
.tail{transform-origin:300px 250px;animation:tl 2s ease-in-out infinite}
.ear{animation:ear 5s infinite;transform-box:fill-box;transform-origin:bottom center}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}
.paw{transform-box:fill-box;transform-origin:center;animation:tp .3s ease-in-out infinite alternate}
.p2{animation-delay:.15s}
.z{font:700 18px 'Segoe UI',sans-serif;fill:#a5b4fc;animation:zz 4s infinite}
.ln{animation:ty 3s steps(12) infinite}
@keyframes tl{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(15deg)}}
@keyframes ear{0%,90%,100%{transform:rotate(0)}95%{transform:rotate(-15deg)}}
@keyframes bl{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes tp{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(20px,-50px)}}
@keyframes ty{0%{clip-path:inset(0 100% 0 0)}60%,100%{clip-path:inset(0 0 0 0)}}
</style>
<rect width="420" height="320" rx="20" fill="url(#bg)"/>
<circle cx="350" cy="60" r="28" fill="#facc15" opacity=".9"/><circle cx="362" cy="52" r="24" fill="#1e1b4b"/>
<text class="z" x="90" y="80">♪</text><text class="z" x="60" y="110" style="animation-delay:2s">♫</text>
<path class="tail" d="M300 250 q60 -10 50 -70 q-5 -25 15 -30" stroke="#fb923c" stroke-width="14" fill="none" stroke-linecap="round"/>
<ellipse cx="230" cy="230" rx="80" ry="50" fill="#fb923c"/>
<path class="ear" d="M160 110 l10 -40 l28 30z" fill="#fb923c"/>
<path class="ear" d="M240 100 l22 -36 l14 42z" fill="#fb923c" style="animation-delay:.3s"/>
<circle cx="215" cy="140" r="58" fill="#fb923c"/>
<ellipse class="eye" cx="193" cy="135" rx="8" ry="10" fill="#0f0c29"/><ellipse class="eye" cx="237" cy="135" rx="8" ry="10" fill="#0f0c29"/>
<circle cx="196" cy="131" r="3" fill="#fff"/><circle cx="240" cy="131" r="3" fill="#fff"/>
<path d="M208 155 l7 6 l7 -6" fill="#ff6ec4"/>
<path d="M215 161 q-8 10 -16 4 M215 161 q8 10 16 4" stroke="#0f0c29" stroke-width="2.5" fill="none"/>
<g stroke="#0f0c29" stroke-width="2"><line x1="170" y1="152" x2="140" y2="146"/><line x1="170" y1="158" x2="140" y2="162"/><line x1="260" y1="152" x2="290" y2="146"/><line x1="260" y1="158" x2="290" y2="162"/></g>
<rect x="190" y="190" width="54" height="12" rx="6" fill="#0f0c29" opacity=".3"/>
<rect x="80" y="230" width="200" height="60" rx="10" fill="#302b63" stroke="#7873f5" stroke-width="3"/>
<g fill="#7873f5" opacity=".7"><rect x="95" y="245" width="18" height="10" rx="2"/><rect x="120" y="245" width="18" height="10" rx="2"/><rect x="145" y="245" width="18" height="10" rx="2"/><rect x="170" y="245" width="18" height="10" rx="2"/><rect x="195" y="245" width="18" height="10" rx="2"/><rect x="220" y="245" width="18" height="10" rx="2"/><rect x="245" y="245" width="18" height="10" rx="2"/><rect x="110" y="265" width="140" height="10" rx="2"/></g>
<ellipse class="paw" cx="150" cy="232" rx="18" ry="11" fill="#fdba74"/><ellipse class="paw p2" cx="215" cy="232" rx="18" ry="11" fill="#fdba74"/>
<rect x="20" y="20" width="130" height="34" rx="8" fill="#0f0c29" stroke="#4ade80"/>
<text class="ln" x="30" y="42" font-family="Consolas,monospace" font-size="14" fill="#4ade80">meow.debug()</text>
</svg>
