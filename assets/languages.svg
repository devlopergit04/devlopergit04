<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0c29"/><stop offset="1" stop-color="#302b63"/></linearGradient></defs>
<style>
.h{font:800 20px 'Segoe UI',sans-serif;fill:#fff}.k{font:600 13px 'Segoe UI',sans-serif;fill:#e0e7ff}
.spin{animation:rt 30s linear infinite;transform-origin:130px 170px}
@keyframes rt{to{transform:rotate(360deg)}}
</style>
<rect width="420" height="320" rx="20" fill="url(#bg)"/>
<text class="h" x="210" y="40" text-anchor="middle">🧬 Code DNA</text>
<g class="spin">
<circle cx="130" cy="170" r="70" fill="none" stroke="#ffffff10" stroke-width="28"/>
<circle cx="130" cy="170" r="70" fill="none" stroke="#facc15" stroke-width="28" stroke-dasharray="154 440" transform="rotate(-90 130 170)"/>
<circle cx="130" cy="170" r="70" fill="none" stroke="#38bdf8" stroke-width="28" stroke-dasharray="110 440" stroke-dashoffset="-154" transform="rotate(-90 130 170)"/>
<circle cx="130" cy="170" r="70" fill="none" stroke="#4ade80" stroke-width="28" stroke-dasharray="88 440" stroke-dashoffset="-264" transform="rotate(-90 130 170)"/>
<circle cx="130" cy="170" r="70" fill="none" stroke="#ff6ec4" stroke-width="28" stroke-dasharray="53 440" stroke-dashoffset="-352" transform="rotate(-90 130 170)"/>
<circle cx="130" cy="170" r="70" fill="none" stroke="#a78bfa" stroke-width="28" stroke-dasharray="35 440" stroke-dashoffset="-405" transform="rotate(-90 130 170)"/>
</g>
<text x="130" y="176" text-anchor="middle" font-family="Consolas,monospace" font-weight="700" font-size="18" fill="#fff">&lt;/&gt;</text>
<g class="k">
<rect x="250" y="100" width="14" height="14" rx="3" fill="#facc15"/><text x="272" y="112">JavaScript/TS 35%</text>
<rect x="250" y="130" width="14" height="14" rx="3" fill="#38bdf8"/><text x="272" y="142">Python 25%</text>
<rect x="250" y="160" width="14" height="14" rx="3" fill="#4ade80"/><text x="272" y="172">HTML/CSS 20%</text>
<rect x="250" y="190" width="14" height="14" rx="3" fill="#ff6ec4"/><text x="272" y="202">Shell/Bash 12%</text>
<rect x="250" y="220" width="14" height="14" rx="3" fill="#a78bfa"/><text x="272" y="232">Other 8%</text>
</g>
</svg>
