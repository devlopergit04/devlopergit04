<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0c29"/><stop offset="1" stop-color="#302b63"/></linearGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#ff6ec4"/><stop offset=".5" stop-color="#7873f5"/><stop offset="1" stop-color="#4ade80"/></linearGradient></defs>
<style>
.h{font:800 22px 'Segoe UI',sans-serif;fill:#fff}
.y{font:800 18px 'Segoe UI',sans-serif}.d{font:500 13px 'Segoe UI',sans-serif;fill:#c7d2fe}
.line{stroke-dasharray:780;stroke-dashoffset:780;animation:dr 2.5s ease forwards}
.n{opacity:0;animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards;transform-box:fill-box;transform-origin:center}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 1.6s ease-out infinite}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes pl{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(2.4)}}
</style>
<rect width="900" height="220" rx="20" fill="url(#bg)"/>
<text class="h" x="450" y="40" text-anchor="middle">🛤️ My Developer Journey</text>
<line class="line" x1="60" y1="110" x2="840" y2="110" stroke="url(#ln)" stroke-width="5" stroke-linecap="round"/>
<g class="n" style="animation-delay:.3s"><circle cx="90" cy="110" r="12" fill="#ff6ec4"/><text class="y" x="90" y="85" text-anchor="middle" fill="#ff6ec4">Start</text><text class="d" x="90" y="145" text-anchor="middle">HTML · CSS</text><text class="d" x="90" y="163" text-anchor="middle">first website 🌐</text></g>
<g class="n" style="animation-delay:.7s"><circle cx="260" cy="110" r="12" fill="#facc15"/><text class="y" x="260" y="85" text-anchor="middle" fill="#facc15">Level 2</text><text class="d" x="260" y="145" text-anchor="middle">JavaScript · Python</text><text class="d" x="260" y="163" text-anchor="middle">logic &amp; algorithms 🧩</text></g>
<g class="n" style="animation-delay:1.1s"><circle cx="450" cy="110" r="12" fill="#38bdf8"/><text class="y" x="450" y="85" text-anchor="middle" fill="#38bdf8">Level 3</text><text class="d" x="450" y="145" text-anchor="middle">React · Node.js</text><text class="d" x="450" y="163" text-anchor="middle">full‑stack apps ⚛️</text></g>
<g class="n" style="animation-delay:1.5s"><circle cx="640" cy="110" r="12" fill="#a78bfa"/><text class="y" x="640" y="85" text-anchor="middle" fill="#a78bfa">Level 4</text><text class="d" x="640" y="145" text-anchor="middle">Bots · Docker · Cloud</text><text class="d" x="640" y="163" text-anchor="middle">automation 🤖</text></g>
<g class="n" style="animation-delay:1.9s"><circle class="pulse" cx="810" cy="110" r="12" fill="#4ade80"/><circle cx="810" cy="110" r="12" fill="#4ade80"/><text class="y" x="810" y="85" text-anchor="middle" fill="#4ade80">Now</text><text class="d" x="810" y="145" text-anchor="middle">AI · System Design</text><text class="d" x="810" y="163" text-anchor="middle">leveling up 🚀</text></g>
</svg>
